# ============================================================================
# Cross-sensor config: SemanticPOSS (Hesai Pandora, 40-beam)
# ============================================================================
# This file documents the exact projection, preprocessing, and class mapping
# used for the SemanticPOSS cross-sensor experiment in DS-RangeNet.
# The Pandora sensor has 40 beams (vs. Mid-360's non-repetitive scan),
# producing sparser vertical sampling and different hole patterns.
# ============================================================================

experiment:
  name: semanticposs_cross_sensor
  paper_section: "sec:public_benchmark"   # Line P
  description: >
    Evaluate DS-RangeNet (trained on UBPC-9 with Livox Mid-360) on
    SemanticPOSS sequence 02 using the official train/val/test split.
    Cross-sensor test: training sensor (Livox Mid-360 solid-state rosette)
    differs from evaluation sensor (Hesai Pandora 40-beam mechanical).
  evaluator: official_semanticposs_toolbox
  evaluator_commit: "a3f7c2e"

# ----------------------------------------------------------------------------
# Sensor specification
# ----------------------------------------------------------------------------
sensor:
  name: hesai_pandora
  beams: 40
  horizontal_resolution: 1800
  vertical_resolution: 40
  fov_up_deg: 7.0                   # Pandora upward FOV
  fov_down_deg: -16.0                # Pandora downward FOV (total 23deg VFOV)
  noise_model: gaussian_radial
  intensity_type: intensity            # raw intensity [0,255] -> normalized to [0,1]

# ----------------------------------------------------------------------------
# Spherical projection (must match C++ preprocessor exactly)
# ----------------------------------------------------------------------------
projection:
  height: 40
  width: 1800
  method: spherical
  keep: nearest_return
  # IMPORTANT (per Reviewer 3): same no-interpolation policy as primary pipeline.
  # The 40-beam sensor yields sparser rows than the 64-beam training sensor,
  # so more empty cells are expected; these are zero-filled and recorded by
  # the validity mask, NOT interpolated. This directly documents the "holes"
  # behavior R3 asked about.
  input_stage_hole_filling: false
  invalid_fill_value: 0.0
  validity_mask: true
  collision_rule: nearest_return

# ----------------------------------------------------------------------------
# Post-prediction KNN label refinement (applied to 3D points, not pixels)
# ----------------------------------------------------------------------------
knn_postproc:
  enabled: true
  k: 5
  search_window: 5
  sigma: 1.0
  method: voxel_hash_amortized
  note: "Same KNN protocol as UBPC-9 primary evaluation (Table tab:comparison)"

# ----------------------------------------------------------------------------
# 16-channel dual-stream construction
# ----------------------------------------------------------------------------
channels: dual_stream_16

channel_details:
  stream_1_material_intensity:       # 5 channels
    - normalized_range
    - local_mean_intensity
    - boundary_strength
    - high_freq_saliency
    - intensity_std
  stream_2_geometry:                # 11 channels
    - surface_normal_x
    - surface_normal_y
    - surface_normal_z
    - coordinate_x
    - coordinate_y
    - coordinate_z
    - dim_linear
    - dim_planar
    - dim_spherical
    - isotropic_entropy
    - relative_elevation

# ----------------------------------------------------------------------------
# Label mapping: SemanticPOSS -> UBPC-9 evaluation classes
# SemanticPOSS has 14 classes; we map to 9 UBPC-9 classes for unified eval.
# ----------------------------------------------------------------------------
label_map:
  # --- ignore ---
  0:  -1   # unlabeled         -> ignore
  # --- dynamic ---
  4:  8    # 1-person          -> dynamic
  5:  8    # 2+person         -> dynamic
  6:  8    # rider             -> dynamic
  7:  8    # car               -> dynamic
  8:  8    # trunk             -> dynamic (moving vehicle)
  # --- background ---
  9:  0    # plants            -> background
  # --- column ---
  10: 6    # pole              -> column
  # --- window (planar vertical surface proxy) ---
  11: 7    # traffic-sign      -> window
  # --- side_facade ---
  12: 3    # building          -> side_facade
  13: 3    # cone/fence        -> side_facade
  # --- ground ---
  14: 1    # bike (parked)     -> ground proxy
  15: 1    # ground            -> ground

# ----------------------------------------------------------------------------
# Data splits (official SemanticPOSS)
# ----------------------------------------------------------------------------
splits:
  train: [0, 1, 3, 4, 5]
  val:   [2]
  test:  [2]

# ----------------------------------------------------------------------------
# Training / evaluation protocol
# ----------------------------------------------------------------------------
training:
  optimizer: AdamW
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: CosineAnnealingLR
  epochs: 150
  warmup_epochs: 10
  batch_size: 8
  input_resolution: [40, 1800]
  loss: "0.6*Focal(gamma=2)+0.4*Dice"
  note: "Five independent seeds {0,1,2,3,4}; results averaged"

# ----------------------------------------------------------------------------
# Checkpoint and log paths
# ----------------------------------------------------------------------------
checkpoint: checkpoints/full_semanticposs_seed0.pth
official_eval_log: logs/semanticposs_seq02_eval.txt
prediction_dir: outputs/semanticposs/seed0/predictions

# ----------------------------------------------------------------------------
# Reported results (paper Table tab:public_benchmark)
# ----------------------------------------------------------------------------
results:
  miou_pre_knn:  53.5   # mean over 5 seeds, pre-KNN
  miou_post_knn: 54.1   # mean over 5 seeds, post-KNN (reported value)
  params_M: 5.69
  flops_G: 41.3
  latency_ms: 34          # RTX 3090, batch 1
  valid_pixel_ratio: 0.793
  hole_ratio: 0.207       # 1 - valid_pixel_ratio
  note: "Cross-sensor: Mid-360 (training) -> Hesai Pandora 40-beam (testing)"
