# DS-RangeNet v3 — full Conda environment (optional).
# Create with:  conda env create -f environment.yml
# Activate with: conda activate ds-rangenet
#
# This mirrors requirements.txt but also pins the CUDA toolkit used for
# GPU training. If you only need CPU inference or use pip, requirements.txt
# is sufficient.
name: ds-rangenet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip=23.3
  # --- PyTorch + CUDA 11.8 ---
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  # --- Numerics / data ---
  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - matplotlib=3.7.5
  - pyyaml=6.0.1
  - tqdm=4.66.1
  - pytest=7.4.4
  # --- pip-only packages ---
  - pip:
      - open3d==0.17.0
      - onnx==1.14.1
      - onnxruntime==1.15.1
# Reminder: TensorRT 8.5 and tegrastats are provided by JetPack on the
# Jetson AGX Orin and are not installed through this environment.
