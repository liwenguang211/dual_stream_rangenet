# ============================================================
# DS-RangeNet — Modality Control Experiments
# Unified configuration (v2, revised per reviewer feedback)
# ============================================================

# ---------- Data ----------
data:
  dataset: "UBPC-9"
  split: "validation"          # IMPORTANT: same split as the 73.2% baseline
  resolution: [64, 512]
  num_classes: 9
  # Class names (for logging)
  classes: [background, ground, roof, side_facade, front_facade,
             beam, column, window, dynamic]

# ---------- Training (for independently trained models) ----------
train:
  batch_size: 8
  epochs: 150
  optimizer: "AdamW"
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 10
  loss: "0.6*focal + 0.4*dice"
  seeds: [0, 1, 2]               # 3 seeds for statistical significance
  device: "cuda"

# ---------- DS-RangeNet baseline checkpoint ----------
baseline:
  checkpoint: "checkpoints/ds_rangenet_val_73.2.pth"
  mIoU: 73.2                      # on validation set, same split
  note: "Full dual-stream model, correctly aligned modalities"

# ---------- Inference-time perturbations ----------
# All use the SAME DS-RangeNet checkpoint above.
perturbations:
  intensity_missing:
    description: "Reflectance channels zero-masked in the full model"
    channels_masked: [0, 1, 2, 3, 4]   # 5 reflectance channels
    value: 0.0
    recompute_geometry: true               # voxel-PCA recomputed on full geometry

  intensity_corrupted:
    description: "I' = clip(1.2*I + eps, 0, 1), eps ~ N(0, 0.05^2)"
    shift_factor: 1.2
    noise_std: 0.05                       # 5% of normalized [0,1] range
    clip_range: [0.0, 1.0]
    recompute_geometry: true

  geometry_sparse:
    description: "Random point removal (30%), voxel-PCA REcomputed"
    removal_fraction: 0.30
    recompute_geometry: true               # CRITICAL: descriptors recomputed
    recompute_curvature: true              # intensity curvature recomputed

  cross_frame_mismatch:
    description: >
      Geometry from frame t, reflectance from a DIFFERENT frame
      within the SAME sequence (not a different scene).
      Random offset sampled from {+1,+5,+10,+20} frames.
    same_sequence: true                    # NOT different scenes
    offset_pool: [1, 5, 10, 20]         # multiple offsets, randomly chosen
    num_trials: 3                          # 3 independent random pairings

# ---------- Output ----------
output:
  log_dir: "logs/"
  results_csv: "results_summary.csv"
  seed_repeats: 3                         # each perturbation repeated 3x
